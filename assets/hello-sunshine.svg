<svg xmlns="http://www.w3.org/2000/svg" width="620" height="588" viewBox="0 0 620 588" role="img" aria-label="温暖的小小 AI 实验室">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFDF9F"/><stop offset="1" stop-color="#F4AF72"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFEFC"/><stop offset="1" stop-color="#FFF8F0"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2FFF7"/><stop offset="1" stop-color="#D8F1E8"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="17" stdDeviation="20" flood-color="#B88E76" flood-opacity=".13"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#B88E76" flood-opacity=".13"/></filter>
  </defs>
  <!-- warm watercolor-like background shapes -->
  <path d="M104 90C196 17 372 2 487 92s115 258 42 366C454 558 252 569 135 497 0 415 12 177 104 90Z" fill="#FCECE0"/>
  <path d="M74 196c-23 100-4 225 97 296C85 465 43 398 35 318c-6-60 9-100 39-122Z" fill="#F8D9CE" opacity=".45"/>
  <circle cx="483" cy="111" r="75" fill="#F9E5B3" opacity=".65"/>
  <path d="M484 20v-16M543 42l12-12M564 108h17M536 167l10 11M421 42l-10-12" stroke="#E5A75A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="491" cy="97" r="51" fill="url(#sun)"/>
  <path d="M472 93v7M509 93v7M479 114q14 15 25 0" stroke="#855E4C" stroke-width="4.2" stroke-linecap="round" fill="none"/>
  <ellipse cx="462" cy="107" rx="7" ry="4" fill="#EC936E" opacity=".65"/><ellipse cx="517" cy="107" rx="7" ry="4" fill="#EC936E" opacity=".65"/>
  <!-- decorative mini stars -->
  <path d="m65 155 7 15 16 7-16 7-7 15-7-15-16-7 16-7 7-15Z" fill="#F4B48A"/>
  <path d="m546 378 5 11 12 5-12 5-5 11-5-11-12-5 12-5 5-11Z" fill="#E8C86E"/>
  <path d="M572 256v16m-8-8h16M143 39v12m-6-6h12" stroke="#E3A882" stroke-width="3" stroke-linecap="round"/>
  <!-- main friendly note/card -->
  <g filter="url(#shadow)">
    <rect x="71" y="100" width="468" height="413" rx="28" fill="url(#cream)" stroke="#EBDCD0" stroke-width="2"/>
  </g>
  <!-- window heading -->
  <rect x="71" y="100" width="468" height="63" rx="28" fill="#FFFAF6"/>
  <path d="M71 143h468" stroke="#F2E7DD" stroke-width="2"/>
  <circle cx="104" cy="133" r="5" fill="#EFA88D"/><circle cx="122" cy="133" r="5" fill="#F7D18E"/><circle cx="140" cy="133" r="5" fill="#9DC6AB"/>
  <text x="163" y="137" font-size="16" fill="#927668" font-weight="600" font-family="Arial, sans-serif">letin's little AI lab</text>
  <path d="M491 128l9 6-9 6" stroke="#C9A08C" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- backdrop panel -->
  <rect x="102" y="180" width="402" height="230" rx="25" fill="#F7F8EF"/>
  <circle cx="300" cy="283" r="91" fill="#EAF1DD" opacity=".75"/>
  <path d="M138 331c41-50 64-51 104-5m139 0c41-57 71-55 103-12" stroke="#D6E6D9" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="5 10"/>
  <!-- tiny note left -->
  <g transform="rotate(-9 155 244)" filter="url(#soft)">
    <rect x="110" y="218" width="101" height="69" rx="14" fill="#FFF" stroke="#F0DDD2" stroke-width="1.5"/>
    <path d="m137 243 9 8 14-14" stroke="#E5A486" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="133" y="273" font-size="12.5" fill="#94756E" font-family="Arial, sans-serif" font-weight="600">be curious!</text>
  </g>
  <!-- tiny note right -->
  <g transform="rotate(7 434 234)" filter="url(#soft)">
    <rect x="399" y="202" width="85" height="68" rx="16" fill="#FFE9D8" stroke="#F3D6BD" stroke-width="1.5"/>
    <path d="m432 224 6 12 13 6-13 5-6 12-5-12-12-5 12-6 5-12Z" fill="#E8AA80"/>
  </g>
  <!-- robot antenna -->
  <path d="M298 213v-20" stroke="#769F91" stroke-width="6" stroke-linecap="round"/>
  <circle cx="298" cy="188" r="10" fill="#F5C580" stroke="#fff" stroke-width="3"/>
  <!-- robot head -->
  <g filter="url(#soft)">
    <rect x="226" y="214" width="144" height="117" rx="33" fill="#FFFEFC" stroke="#B9D4C8" stroke-width="5"/>
    <rect x="240" y="229" width="116" height="86" rx="24" fill="url(#screen)"/>
    <rect x="214" y="263" width="15" height="29" rx="7" fill="#E3CDB8"/>
    <rect x="367" y="263" width="15" height="29" rx="7" fill="#E3CDB8"/>
  </g>
  <!-- robot smile -->
  <path d="M269 260v8m56-8v8M279 285q19 18 38 0" stroke="#667F78" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <circle cx="257" cy="282" r="7" fill="#F4BDAD" opacity=".8"/><circle cx="336" cy="282" r="7" fill="#F4BDAD" opacity=".8"/>
  <!-- robot arms/body -->
  <path d="M244 350q-26-25-42 1m149 0q25-25 42-1" stroke="#95B9A9" stroke-width="10" stroke-linecap="round" fill="none"/>
  <g filter="url(#soft)"><path d="M246 340q50-20 103 0l10 47H236l10-47Z" fill="#B9DCCC" stroke="#92B7A6" stroke-width="3"/></g>
  <path d="m280 357 17 15 17-15" stroke="#FFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="298" cy="399" rx="105" ry="8" fill="#DDE9DB" opacity=".7"/>
  <!-- process chips -->
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="103" y="430" width="119" height="57" rx="17" fill="#FBE5DD" stroke="#F3D1C3"/>
    <text x="162" y="452" font-size="14" fill="#A76857">01 · SEE</text><text x="162" y="470" font-size="11" font-weight="500" fill="#9C7E73">perception</text>
    <path d="M234 458h16m-5-6 6 6-6 6" stroke="#C6BBA5" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <rect x="258" y="430" width="119" height="57" rx="17" fill="#E5F1E9" stroke="#CFE5D9"/>
    <text x="318" y="452" font-size="14" fill="#4A8573">02 · THINK</text><text x="318" y="470" font-size="11" font-weight="500" fill="#79998C">reasoning</text>
    <path d="M389 458h16m-5-6 6 6-6 6" stroke="#C6BBA5" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <rect x="412" y="430" width="101" height="57" rx="17" fill="#FFF0D1" stroke="#F3E0B7"/>
    <text x="463" y="452" font-size="14" fill="#AD8143">03 · DO</text><text x="463" y="470" font-size="11" font-weight="500" fill="#AD9873">action</text>
  </g>
  <!-- small plant on lower left -->
  <g transform="translate(35 436) rotate(-9)">
    <path d="M13 64 6 27h55L52 64Z" fill="#DCA78A" stroke="#C58E74" stroke-width="2"/>
    <path d="M33 27V-24M33 8C6 10 6-17-1-21 24-25 33-11 33 8ZM34-5C55-25 70-22 76-36c-29-6-47 5-42 31Z" stroke="#779B77" stroke-width="2.5" fill="#A9CDA2" stroke-linejoin="round"/>
  </g>
  <!-- floating pastel dots -->
  <circle cx="76" cy="386" r="5" fill="#DFB997"/><circle cx="548" cy="433" r="5" fill="#A6C8B4"/>
  <path d="M560 177q10-7 20 1m-12 10q10-7 20 1" fill="none" stroke="#E3BDA7" stroke-width="3" stroke-linecap="round"/>
  <text x="464" y="539" font-family="Arial, sans-serif" font-size="12" fill="#C39884" letter-spacing="2">KEEP GROWING ✳</text>
</svg>
